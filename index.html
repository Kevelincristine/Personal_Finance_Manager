<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Finance Manager</title>
  <link rel="shortcut icon" href="img/icon-site.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="start-screen">
    <h1>Welcome to your financial management app</h1>
    <p>Let's start by defining some basic information.</p>

    <div id="start-container">
      <label>
        Your name:
        <input type="text" id="name-input"/>
      </label>
      <label>
        Starting balance
        <input type="number" id="initial-balance" />
      </label>

      <button id="start-btn" type="button">Start</button>
    </div>
  </section>
  <!-- END START SCREEN -->

  <!-- MAIN APP -->
  <section class="app-hidden">

    <header>
      <h2>Hello, <span id="user-name">Name</span> &#128075;</h2>
      <h1>Balance: $ <span id="balance">0</span></h1>
      <p>Add income and expenses to track your money.</p>
    </header>
    <!-- END HEADER -->

    <!-- NEW TRANSACTION -->
    <article id="transactions">
      <h2>New transaction</h2>

      <label>
        Value
        <input type="number" id="transaction-value" placeholder="Value" />
      </label>

      <label>
        Type
        <select id="transaction-type">
          <option value="">Select type</option>
          <option value="income">Income</option>
          <option value="expense">Expense</option>
        </select>
      </label>

      <label>
        Category
        <select id="transaction-category">
          <option value="">Select category</option>
          <option>Food</option>
          <option>Study</option>
          <option>Leisure</option>
          <option>Other...</option>
        </select>
      </label>

      <button id="add-transaction" type="button">Add</button>
    </article>
    <!-- END TRANSACTION -->

    <!-- HISTORY -->
    <article id="history-container">
      <h2>History</h2>
      <input type="date"id="search-date">
      <button id="search-btn">Search</button>
      <button id="every">show everything</button>

      <ul id="history"></ul>
    </article>
    <!-- END HISTORY -->

    <!-- FOOTER -->
    <footer>
      <p>Made by Kevelin Cristine</p>
      <nav>
        <a href="https://github.com/Kevelincristine" target="_blank">GitHub</a> |
        <a href="https://portfolio-pied-three-64.vercel.app/" target="_blank">Portfolio</a>
      </nav>
    </footer>

  </section>
  <!-- END APP -->
 <script src="script.js"></script>
</body>
</html>
